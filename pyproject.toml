[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcusqueeze"
version = "0.1.0"
description = "Auto-quantize AI models for MCUs — starting with ESP32-S3"
authors = [
    { name = "Morched Ammar", email = "morcheda62@gmail.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "onnx>=1.14.0",
    "onnxruntime>=1.16.0",
    "tf2onnx>=1.14.0",
    "tensorflow>=2.12.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "numpy>=1.24.0",
    "Pillow>=9.0.0",
]

[project.scripts]
mcusqueeze = "mcusqueeze.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]